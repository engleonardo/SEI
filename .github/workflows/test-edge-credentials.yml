name: Test Edge credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Check Edge secrets and API auth
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets and call Edge API without mutating anything
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail

          missing=0
          for name in EDGE_CLIENT_ID EDGE_API_KEY EDGE_PRODUCT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não está configurado nos secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if ! [[ "$EDGE_PRODUCT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::EDGE_PRODUCT_ID não parece um GUID válido."
            exit 1
          fi

          echo "Secrets presentes e EDGE_PRODUCT_ID com formato de GUID."
          echo "Testando a rota documentada /v1/products/... sem alterar nada..."

          base="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID"
          operation="00000000-0000-0000-0000-000000000000"
          url="$base/submissions/draft/package/operations/$operation"
          body=$(mktemp)

          code_anon=$(curl -sS -o "$body" -w "%{http_code}" "$url")
          echo "Sem credenciais: HTTP $code_anon"
          if [ "$code_anon" != "401" ] && [ "$code_anon" != "403" ]; then
            echo "::error::A rota não respondeu 401/403 sem credenciais (HTTP $code_anon). A rota pode ter mudado; não é possível validar a chave com segurança."
            cat "$body" || true
            exit 1
          fi

          code_auth=$(curl -sS -o "$body" -w "%{http_code}" \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            "$url")
          echo "Com credenciais: HTTP $code_auth"
          cat "$body" || true

          case "$code_auth" in
            400|404)
              echo "::notice::Credenciais aceitas pela API (HTTP $code_auth em uma operação inexistente)."
              ;;
            401)
              echo "::error::Credenciais inválidas (HTTP 401). Confira EDGE_CLIENT_ID e EDGE_API_KEY."
              exit 1
              ;;
            403)
              echo "::error::Credenciais sem permissão (HTTP 403). Confira o acesso ao produto no Partner Center."
              exit 1
              ;;
            *)
              echo "::warning::Resposta inesperada (HTTP $code_auth). Confira o corpo acima."
              exit 1
              ;;
          esac

          echo "::notice::Teste concluído sem enviar pacote e sem publicar nada."
