name: Test Edge credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Probe Edge API auth (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints and auth combinations
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail

          for name in EDGE_CLIENT_ID EDGE_API_KEY EDGE_PRODUCT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name não configurado."
              exit 1
            fi
          done

          base="https://api.addons.microsoftedge.microsoft.com/v1.1/products/$EDGE_PRODUCT_ID"
          operation="00000000-0000-0000-0000-000000000000"
          body=$(mktemp)

          probe() {
            local label="$1"
            shift
            local code
            code=$(curl -sS -o "$body" -w "%{http_code}" "$@")
            echo "== $label =="
            echo "HTTP $code"
            head -c 300 "$body" || true
            echo
          }

          url_status="$base/submissions/draft/package/operations/$operation"
          probe "status: sem credenciais" "$url_status"
          probe "status: credenciais reais" \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            "$url_status"
          probe "status: chave inválida" \
            -H "Authorization: ApiKey chave-invalida-de-teste" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            "$url_status"
          probe "status: client inválido" \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: 00000000-0000-0000-0000-000000000000" \
            "$url_status"

          probe "submissions GET: sem credenciais" "$base/submissions"
          probe "submissions GET: credenciais reais" \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            "$base/submissions"

          probe "package GET: sem credenciais" "$base/submissions/draft/package"
          probe "package GET: credenciais reais" \
            -H "Authorization: ApiKey $EDGE_API_KEY" \
            -H "X-ClientID: $EDGE_CLIENT_ID" \
            "$base/submissions/draft/package"

          probe_methods() {
            local path="$1"
            local name="$2"
            for method in OPTIONS HEAD; do
              local flag=(-X "$method")
              if [ "$method" = "HEAD" ]; then
                flag=(-I)
              fi
              probe "$name $method: sem credenciais" "${flag[@]}" "$path"
              probe "$name $method: credenciais reais" "${flag[@]}" \
                -H "Authorization: ApiKey $EDGE_API_KEY" \
                -H "X-ClientID: $EDGE_CLIENT_ID" \
                "$path"
              probe "$name $method: chave inválida" "${flag[@]}" \
                -H "Authorization: ApiKey chave-invalida-de-teste" \
                -H "X-ClientID: $EDGE_CLIENT_ID" \
                "$path"
            done
          }

          probe_methods "$base/submissions/draft/package" "upload"
          probe_methods "$base/submissions" "publish"

          echo "::notice::Diagnóstico concluído sem enviar pacote e sem publicar nada."
