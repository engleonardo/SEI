name: Store status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: Check Chrome Web Store credentials
    runs-on: ubuntu-latest
    steps:
      - name: Exchange refresh token and fetch item status
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$CWS_EXTENSION_ID" ] || [ -z "$CWS_PUBLISHER_ID" ] || [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_CLIENT_SECRET" ] || [ -z "$CWS_REFRESH_TOKEN" ]; then
            echo "::error::Um ou mais segredos da Chrome Web Store estão ausentes."
            exit 1
          fi

          token_response=$(curl -sS -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CWS_CLIENT_ID" \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d "grant_type=refresh_token")

          access_token=$(printf '%s' "$token_response" | jq -r '.access_token // empty')
          if [ -z "$access_token" ]; then
            echo "::error::Falha ao obter access token. Verifique Client ID, Client Secret e refresh token."
            printf '%s' "$token_response" | jq '{error, error_description}'
            exit 1
          fi

          http_code=$(curl -sS -o status.json -w '%{http_code}' \
            "https://chromewebstore.googleapis.com/v2/publishers/${CWS_PUBLISHER_ID}/items/${CWS_EXTENSION_ID}:fetchStatus" \
            -H "Authorization: Bearer ${access_token}")

          echo "HTTP ${http_code}"
          jq . status.json

          if [ "$http_code" != "200" ]; then
            echo "::error::A consulta de status falhou. Verifique Publisher ID, Extension ID e se a Chrome Web Store API está ativa."
            exit 1
          fi

          echo "::notice::Credenciais válidas. O item foi consultado com sucesso."
