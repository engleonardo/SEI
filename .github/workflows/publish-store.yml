name: Publish to stores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já publicada (ex.: v1.0.0). Deixe vazio para usar a branch atual.'
        required: false

permissions:
  contents: read

concurrency:
  group: publish-store-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm run build && npm run zip
      - run: npm run build:firefox && npm run zip:firefox

      - name: Check store credentials
        id: credentials
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$CWS_EXTENSION_ID" ] && [ -n "$CWS_PUBLISHER_ID" ] && [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_CLIENT_SECRET" ] && [ -n "$CWS_REFRESH_TOKEN" ]; then
            echo "chrome=true" >> "$GITHUB_OUTPUT"
          else
            echo "chrome=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome Web Store secrets ausentes; upload automático ignorado."
          fi
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            echo "firefox=true" >> "$GITHUB_OUTPUT"
          else
            echo "firefox=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Segredos da AMO ausentes; assinatura automática ignorada."
          fi

      - name: Upload and publish on Chrome Web Store
        if: steps.credentials.outputs.chrome == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@4 \
            --source ".output/sei-flow-${{ steps.version.outputs.value }}-chrome.zip" \
            --extension-id "$EXTENSION_ID"
          echo "::notice::Pacote enviado e publicado na Chrome Web Store. A revisão da loja é assíncrona."

      - name: Sign and submit on Firefox Add-ons (AMO)
        if: steps.credentials.outputs.firefox == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10 sign \
            --source-dir .output/firefox-mv3 \
            --artifacts-dir .output/amo \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --channel listed \
            --upload-source-code ".output/sei-flow-${{ steps.version.outputs.value }}-sources.zip"
          echo "::notice::Pacote enviado à AMO. A revisão da Mozilla é assíncrona."
